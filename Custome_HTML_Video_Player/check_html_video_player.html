<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom HTML5 Video Player</title>
    <link rel="stylesheet" href="custome.css" />
  </head>
  <body>
    <h1>Video Player</h1>
    <div class="player">
     <video src="video/yuhun_en.mp4" class="player__video viewer">
         Your browser doesn't support HTML5 video.
  
     </video>
      </video>
      <div class="controls">
        <div class="progress">
          <div class="progress__filled"></div>
        </div>
        <button class="controls__button toggle" title="Toggle Play">
          ►
        </button>
        <div class="duration">
            0:00 / 0:00
        </div> 

        <input
          type="range"
          name="volume"
          class="player__slider"
          min="0"
          max="1"
          step="0.05"
          value="1"
        />
        <input
          type="range"
          name="playbackRate"
          class="player__slider"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
        />
        <button class="controls__button" data-skip="-10">« 10s</button>
        <button class="controls__button" data-skip="10">10s »</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
